name: Native TTS CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev,api] --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m compileall -q src tests
      - run: pytest -q
