name: Native TTS CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev,api] --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m compileall -q src tests
      - name: Install ffmpeg for real MP3 decode coverage
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pytest -q
