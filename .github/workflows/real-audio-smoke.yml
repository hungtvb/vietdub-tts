name: Real Vietnamese Audio Probe
on:
  push:
    branches: [main]
    paths:
      - src/vietdub_native/real_audio_probe.py
      - tests/test_real_audio_probe.py
      - .github/workflows/real-audio-smoke.yml
  workflow_dispatch:
jobs:
  fosd-real-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio dependencies
        run: pip install 'numpy>=1.26' 'soundfile>=0.12' 'soxr>=0.5'
      - name: Install ffmpeg decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Inspect dataset viewer audio schema (metadata only)
        run: |
          PYTHONPATH=src python - <<'PY'
          from vietdub_native.real_audio_probe import _find_split, _load_rows
          config, split = _find_split()
          first = _load_rows(config, split, 1)[0].get("row", {})
          print("fields:", list(first.keys()))
          for key, value in first.items():
              if key not in ("text", "transcription"):
                  print(key, "type=", type(value).__name__,
                        "keys=", list(value.keys()) if isinstance(value, dict) else "-",
                        "is_none=", value is None)
          audio = first.get("audio")
          if isinstance(audio, list):
              print("audio_list_length:", len(audio))
              if audio:
                  first_audio = audio[0]
                  print("first_audio_type:", type(first_audio).__name__,
                        "first_audio_keys:", list(first_audio.keys()) if isinstance(first_audio,dict) else "-")
          PY
      - name: Probe genuine Vietnamese recordings (never train or publish voices)
        run: >-
          PYTHONPATH=src python -m vietdub_native.real_audio_probe
          --output data/real-audio-probe --limit 6 --min-ok 2 --acknowledge-rights
      - name: Log rejection diagnostics
        if: always()
        run: |
          if [ -f data/real-audio-probe/rejects.json ]; then
            cat data/real-audio-probe/rejects.json
          fi
      - name: Publish anonymous QA report (no waveform, transcript, or speaker ID)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fosd-real-audio-qa
          path: data/real-audio-probe/report.json
          if-no-files-found: warn
