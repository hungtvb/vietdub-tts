[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietdub-tts"
version = "0.1.0"
description = "Independent expressive Vietnamese film dubbing TTS engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "soxr>=0.5,<2",
]

[project.optional-dependencies]
model = ["vieneu>=3.8.3,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
vietdub-tts = "vietdub_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
