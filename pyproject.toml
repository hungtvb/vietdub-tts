[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietdub-native-tts"
version = "0.1.0"
description = "From-scratch, emotion-conditioned acoustic and waveform models for Vietnamese film dubbing"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "soundfile>=0.12", "torchaudio>=2.2", "soxr>=0.5"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
vietdub-native = "vietdub_native.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
